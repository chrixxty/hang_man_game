<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#f3ead8; --panel:#fffaf0; --ink:#1d2a44; --muted:#5c6780; --line:#1d2a44;
  --key:#ffffff; --key-border:#c9bda3; --accent:#e08a00; --good:#2f8f5b; --bad:#c8402f; --glow:#ffd36b;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a30; --panel:#18253f; --ink:#f4ecd8; --muted:#9fb0cf; --line:#f4ecd8;
    --key:#223253; --key-border:#33466e; --accent:#ffb703; --good:#5ad08f; --bad:#ff7a66; --glow:#ffcf5c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a30; --panel:#18253f; --ink:#f4ecd8; --muted:#9fb0cf; --line:#f4ecd8;
  --key:#223253; --key-border:#33466e; --accent:#ffb703; --good:#5ad08f; --bad:#ff7a66; --glow:#ffcf5c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:720px;padding:20px 16px 32px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:"Patua One",Georgia,serif;font-weight:400;font-size:2.4rem;margin:0;letter-spacing:.02em}
.tools{display:flex;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{background:var(--panel);border:2px solid var(--key-border);border-radius:999px;padding:6px 14px;font-weight:700}
.chip:focus-visible,.key:focus-visible,.primary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.score{display:flex;gap:16px;color:var(--muted);font-weight:700;margin:6px 0 0}
.score b{color:var(--ink)}
.stage{background:var(--panel);border:2px solid var(--key-border);border-radius:20px;margin-top:16px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center}
svg{width:100%;max-width:300px;height:auto}
.gallows{stroke:var(--line);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
.part{stroke:var(--line);stroke-width:6;stroke-linecap:round;fill:none;opacity:0;transform-origin:center;transition:opacity .25s}
.part.show{opacity:1;animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.lamp{fill:var(--glow);opacity:.9}
.figure{transform-origin:200px 50px}
.lost .figure{animation:sway 1.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.lost .part{stroke:var(--bad)}
.won .part{stroke:var(--good)}
.hint{margin:4px 0 0;color:var(--muted);font-weight:700}
.lives{display:flex;gap:6px;margin-top:6px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--good);transition:background .2s}
.dot.gone{background:var(--key-border)}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 6px;min-height:64px}
.slot{width:clamp(30px,9vw,48px);height:clamp(44px,12vw,60px);border-bottom:5px solid var(--line);font-family:"Patua One",Georgia,serif;font-size:clamp(1.8rem,7vw,2.8rem);text-align:center;line-height:1.25}
.slot.miss{color:var(--bad)}
.msg{min-height:32px;text-align:center;font-weight:800;font-size:1.2rem;margin:0 0 8px}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(42px,1fr));gap:8px}
.key{background:var(--key);border:2px solid var(--key-border);border-radius:10px;padding:10px 0;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 var(--key-border)}
.key:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--key-border)}
.key.hit{background:var(--good);border-color:var(--good);color:#fff}
.key.nope{background:var(--bad);border-color:var(--bad);color:#fff}
.key:disabled{cursor:default;opacity:.85}
.primary{display:block;margin:18px auto 0;background:var(--accent);color:#1d1400;border:0;border-radius:12px;padding:12px 28px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1>Hangman</h1>
    <div class="tools">
      <button class="chip" id="theme" aria-label="Toggle light or dark theme">Theme</button>
    </div>
  </header>
  <p class="score">Wins <b id="wins">0</b> Losses <b id="losses">0</b></p>

  <section class="stage" id="stage" aria-label="Gallows">
    <svg viewBox="0 0 300 300" role="img" aria-label="Hangman drawing">
      <circle class="lamp" cx="60" cy="40" r="14"/>
      <path class="gallows" d="M30 280H170M70 280V30H200V62M70 70L110 30"/>
      <g class="figure">
        <circle class="part" id="p0" cx="200" cy="90" r="28"/>
        <path class="part" id="p1" d="M200 118V190"/>
        <path class="part" id="p2" d="M200 140L165 172"/>
        <path class="part" id="p3" d="M200 140L235 172"/>
        <path class="part" id="p4" d="M200 190L170 245"/>
        <path class="part" id="p5" d="M200 190L230 245"/>
      </g>
    </svg>
    <p class="hint" id="hint"></p>
    <div class="lives" id="lives" aria-label="Lives left"></div>
  </section>

  <div class="word" id="word" aria-live="polite"></div>
  <p class="msg" id="msg"></p>
  <div class="kb" id="kb"></div>
  <button class="primary" id="again">New word</button>
</main>

<script>
(function(){
  var WORDS = {
    Animals:["elephant","penguin","giraffe","dolphin","kangaroo","butterfly","tiger","octopus"],
    Food:["chocolate","pancake","mango","sandwich","noodles","biryani","popcorn","avocado"],
    Places:["mountain","volcano","library","airport","island","desert","lighthouse","stadium"],
    Things:["umbrella","keyboard","bicycle","compass","diamond","telescope","guitar","backpack"]
  };
  var MAX = 6, word, cat, guessed, wrong, over, wins = 0, losses = 0;
  var $ = function(id){ return document.getElementById(id); };
  var kb = $("kb"), wordEl = $("word"), msg = $("msg"), stage = $("stage");

  "abcdefghijklmnopqrstuvwxyz".split("").forEach(function(ch){
    var b = document.createElement("button");
    b.className = "key"; b.textContent = ch.toUpperCase(); b.dataset.k = ch;
    b.setAttribute("aria-label", "Letter " + ch);
    b.addEventListener("click", function(){ guess(ch); });
    kb.appendChild(b);
  });

  function lives(){
    var l = $("lives"); l.innerHTML = "";
    for (var i = 0; i < MAX; i++){
      var d = document.createElement("span");
      d.className = "dot" + (i >= MAX - wrong ? " gone" : "");
      l.appendChild(d);
    }
  }

  function render(){
    wordEl.innerHTML = "";
    word.split("").forEach(function(ch){
      var s = document.createElement("span");
      var shown = guessed.has(ch);
      s.className = "slot" + (!shown && over ? " miss" : "");
      s.textContent = shown || over ? ch.toUpperCase() : "";
      wordEl.appendChild(s);
    });
    for (var i = 0; i < MAX; i++) $("p" + i).classList.toggle("show", i < wrong);
    lives();
  }

  function start(){
    var cats = Object.keys(WORDS);
    cat = cats[Math.floor(Math.random() * cats.length)];
    var list = WORDS[cat];
    word = list[Math.floor(Math.random() * list.length)];
    guessed = new Set(); wrong = 0; over = false;
    stage.className = "stage";
    msg.textContent = "";
    $("hint").textContent = "Category: " + cat + " · " + word.length + " letters";
    Array.prototype.forEach.call(kb.children, function(b){
      b.disabled = false; b.className = "key";
    });
    render();
  }

  function guess(ch){
    if (over || guessed.has(ch)) return;
    guessed.add(ch);
    var btn = kb.querySelector('[data-k="' + ch + '"]');
    btn.disabled = true;
    if (word.indexOf(ch) > -1){
      btn.classList.add("hit");
    } else {
      btn.classList.add("nope"); wrong++;
    }
    var won = word.split("").every(function(c){ return guessed.has(c); });
    if (won){
      over = true; wins++; stage.classList.add("won");
      msg.style.color = "var(--good)"; msg.textContent = "You got it! Well played.";
    } else if (wrong >= MAX){
      over = true; losses++; stage.classList.add("lost");
      msg.style.color = "var(--bad)"; msg.textContent = "Out of lives. The word was " + word.toUpperCase() + ".";
    }
    if (over){
      $("wins").textContent = wins; $("losses").textContent = losses;
      Array.prototype.forEach.call(kb.children, function(b){ b.disabled = true; });
    }
    render();
  }

  document.addEventListener("keydown", function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^[a-z]$/i.test(e.key)) guess(e.key.toLowerCase());
    else if (e.key === "Enter" && over) start();
  });
  $("again").addEventListener("click", start);
  $("theme").addEventListener("click", function(){
    var r = document.documentElement;
    var dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });

  start();
})();
</script>
</body>
</html>
